modules:
  - id: purpose
    title: "1. Understand the access review"
  - id: review-access
    title: "2. Understand the access that reaches a review"
  - id: choose-review
    title: "3. Choose the review approach"
lessons:
  - id: CRT-001
    module: purpose
    placement: "Module 1 · Lesson 1"
    title: "Why review access that somebody already approved?"
    description: "Connect an earlier approval, current business need, the review decision and the verified access outcome."
    source: "lessons/CRT-001_Why_Review_Previously_Approved_Access.md"
    url: "/lessons/CRT-001_Why_Review_Previously_Approved_Access.html"
  - id: CRT-002
    module: purpose
    placement: "Module 1 · Lesson 2"
    title: "A campaign, a certification and a review item: what is being assigned?"
    description: "Connect a campaign, assigned reviews, individual access items and the people responsible for the work."
    source: "lessons/CRT-002_Campaigns_Certifications_and_Review_Items.md"
    url: "/lessons/CRT-002_Campaigns_Certifications_and_Review_Items.html"
  - id: CRT-003
    module: purpose
    placement: "Module 1 · Lesson 3"
    title: "Follow one review from access data to a verified outcome"
    description: "Follow collected access through a review decision, automated or manual removal and exact-account evidence."
    source: "lessons/CRT-003_From_Access_Data_to_a_Verified_Outcome.md"
    url: "/lessons/CRT-003_From_Access_Data_to_a_Verified_Outcome.html"
  - id: CRT-004
    module: purpose
    placement: "Module 1 · Lesson 4"
    title: "How is a certification different from an access request or lifecycle rule?"
    description: "Distinguish requested changes, current access reviews and lifecycle requirements, including why assignment origin matters."
    source: "lessons/CRT-004_Certifications_Access_Requests_and_Lifecycle_Rules.md"
    url: "/lessons/CRT-004_Certifications_Access_Requests_and_Lifecycle_Rules.html"
  - id: CRT-005
    module: review-access
    placement: "Module 2 · Lesson 1"
    title: "How does application access become information ISC can review?"
    description: "Connect source account fields, schema, aggregation, entitlement details and identity ownership with the access presented for review."
    source: "lessons/CRT-005_From_Application_Access_to_Reviewable_Information.md"
    url: "/lessons/CRT-005_From_Application_Access_to_Reviewable_Information.html"
  - id: CRT-006
    module: review-access
    placement: "Module 2 · Lesson 2"
    title: "Are we reviewing an entitlement, an access profile or a role?"
    description: "Identify the actual review object and assignment origin, then connect the decision with its complete access scope."
    source: "lessons/CRT-006_Entitlements_Access_Profiles_and_Roles_in_a_Review.md"
    url: "/lessons/CRT-006_Entitlements_Access_Profiles_and_Roles_in_a_Review.html"
  - id: CRT-007
    module: review-access
    placement: "Module 2 · Lesson 3"
    title: "Why does some access appear differently or not appear at all?"
    description: "Distinguish expected package or lifecycle representation from missing data, excluded access and different observation times."
    source: "lessons/CRT-007_Why_Access_Appears_Differently_or_Is_Missing.md"
    url: "/lessons/CRT-007_Why_Access_Appears_Differently_or_Is_Missing.html"
  - id: CRT-008
    module: review-access
    placement: "Module 2 · Lesson 4"
    title: "One person has two accounts. Which account's access is under review?"
    description: "Connect exact account references, ownership, current need and verified access outcomes, including uncorrelated and service-account recognition."
    source: "lessons/CRT-008_One_Person_Two_Accounts_and_the_Correct_Review_Target.md"
    url: "/lessons/CRT-008_One_Person_Two_Accounts_and_the_Correct_Review_Target.html"
  - id: CRT-009
    module: review-access
    placement: "Module 2 · Lesson 5"
    title: "Can the reviewer understand what this access actually permits?"
    description: "Connect permission meaning, useful descriptions, access context and current business need."
    source: "lessons/CRT-009_Understanding_What_Access_Actually_Permits.md"
    url: "/lessons/CRT-009_Understanding_What_Access_Actually_Permits.html"
  - id: CRT-010
    module: review-access
    placement: "Module 2 · Lesson 6"
    title: "How do we establish that the review population is complete?"
    description: "Compare an independent expected population with actual generated people, accounts and access."
    source: "lessons/CRT-010_Checking_That_the_Review_Population_Is_Complete.md"
    url: "/lessons/CRT-010_Checking_That_the_Review_Population_Is_Complete.html"
  - id: CRT-011
    module: choose-review
    placement: "Module 3 · Lesson 1"
    title: "When is a manager review the right choice?"
    description: "Connect current work, manager information and the actual assignment of review work."
    source: "lessons/CRT-011_When_a_Manager_Review_Is_the_Right_Choice.md"
    url: "/lessons/CRT-011_When_a_Manager_Review_Is_the_Right_Choice.html"
  - id: CRT-012
    module: choose-review
    placement: "Module 3 · Lesson 2"
    title: "When should source owners review access?"
    description: "Connect selected sources, recorded ownership, technical knowledge and actual review responsibility."
    source: "lessons/CRT-012_When_Source_Owners_Should_Review_Access.md"
    url: "/lessons/CRT-012_When_Source_Owners_Should_Review_Access.html"
  - id: CRT-013
    module: choose-review
    placement: "Module 3 · Lesson 3"
    title: "Start with people or start with access items?"
    description: "Choose the right starting records, follow the included people and check which access reaches review."
    source: "lessons/CRT-013_Starting_with_People_or_Access_Items.md"
    url: "/lessons/CRT-013_Starting_with_People_or_Access_Items.html"

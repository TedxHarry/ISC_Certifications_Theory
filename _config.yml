title: "SailPoint ISC Certifications"
description: "Understand access reviews, decisions, and verified outcomes."
url: "https://tedxharry.github.io"
baseurl: "/ISC_Certifications_Theory"
repository: "TedxHarry/ISC_Certifications_Theory"
lang: en
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
titles_from_headings:
  enabled: true
  strip_title: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "lessons"
    values:
      layout: lesson
  - scope:
      path: "hands-on/lessons"
    values:
      layout: hands-on-lesson
exclude:
  - README.md
  - AGENTS.md
  - COURSE_DESIGN.md
  - AUTHOR_SOURCE_MAP.md
  - OPERATIONAL_TASK_COVERAGE.md
  - COURSE_REGISTER.md
  - TEACHING_SPECIFICATION.md
  - DESIGN.md
  - author
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - tests
  - .github
  - hands-on/author
  - hands-on/README.md
  - hands-on/AGENTS.md
  - hands-on/COURSE_DESIGN.md
  - hands-on/COURSE_REGISTER.md
  - hands-on/TEACHING_SPECIFICATION.md
  - hands-on/CSV_LAB_STRATEGY.md
  - hands-on/LAB_ENVIRONMENT.md
  - hands-on/lab-data/BASELINE_SPECIFICATION.md
  - hands-on/lab-data/baselineA/README.md
  - hands-on/lab-data/baselineB/README.md
  - hands-on/lab-data/baselineC/README.md
  - hands-on/lab-data/baselineD/README.md
  - hands-on/lab-data/baselineE/README.md
  - hands-on/lab-data/baselineF/README.md
  - hands-on/private
  - hands-on/evidence
